<style>

  body{

  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 0;
    text-align: center;
    backdrop-filter: blur(8px);
    background: rgba(10,10,10,0.6);

  .navbar a {
 font-family: 'Cinzel Decorative', cursive;

    transition: 0.3s;
font-size:20px;

  .navbar a:hover {
 background: linear-gradient(90deg, #2c3e50, #4ca1af);

padding:7px 10px;
border-radius:6px;

  }


  /* Grid */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:35px;
    padding:120px 60px 80px;
  }

  .product-card{
    background:rgba(25,25,25,0.85);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    transition:0.3s ease;
  }
  .product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 30px rgba(0,0,0,0.8);
  }
  .product-card img{
    width:100%;
    height:380px;
    object-fit:cover;
    opacity:0.95;
    transition:0.3s;
  }
  .product-card:hover img{
    opacity:1;
  }
  .product-info{

    text-align:center;
  }
  .product-info h4{
    color:#fff;
    margin-bottom:8px;
    font-weight:500;
  }
  .price{
    color:#ff5fa2;
    font-weight:600;
    margin-bottom:15px;
  }

  /* Buttons */
  .btn{
    padding:10px 25px;
    border:none;
    border-radius:25px;
    font-size:0.9em;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.3s;

  }
  .btn-cart{

    color:#ff5fa2;

  }
  .btn-cart:hover{

  .btn-buy{

  }

  }

  footer{

    padding:40px 10px;
    color:#999;
    font-size:0.9em;
    letter-spacing:1px;
  }
</style>

<!-- SCRIPT: cart logic and cart count -->
<script>
  // load cart from localStorage or empty
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  // update cart count badge in navbar
  function updateCartCount() {
    const countEl = document.getElementById('cart-count');
    const totalItems = cart.reduce((sum, it) => sum + it.quantity, 0);
    countEl.textContent = totalItems;
  }

  // Add to Cart buttons
  document.querySelectorAll('.btn-cart').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const name = btn.dataset.name;
      const price = Number(btn.dataset.price);
      const image = btn.dataset.image;

      if (!name || !price || !image) {
        alert('Product data missing. Make sure data-name, data-price and data-image exist.');
        return;
      }

      const existing = cart.find(i => i.name === name);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ name, price, image, quantity: 1 });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${name} added to your cart!`);
    });
  });

  // Buy Now buttons -> save single product and go to checkout
  document.querySelectorAll('.btn-buy').forEach(btn => {
    btn.addEventListener('click', () => {
      const product = {
        name: btn.dataset.name,
        price: Number(btn.dataset.price),
        image: btn.dataset.image
      };
      if (!product.name || !product.price || !product.image) {
        alert('Product data missing.');
        return;
      }
      localStorage.setItem('checkout', JSON.stringify(product));
      window.location.href = 'checkout.html';
    });
  });

  // on page load, show current cart count
  updateCartCount();
</script>
