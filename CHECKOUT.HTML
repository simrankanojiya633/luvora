<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Luvora</title>
  <style>
    body { background:#0d0d0d; color:#fff; font-family:'Poppins',sans-serif; text-align:center; padding:0px; }
    .box { background:#1a1a1a; padding:10px; border-radius:22px; width:460px; margin:auto;}
    img { max-width:260px; border-radius:10px; object-fit:cover; display:block; margin:10px auto; }
    button { background:#ff5fa2; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; color:#111; font-weight:bold; margin-top:10px;}
    a { color:#ff5fa2; text-decoration:none; display:INLINE; margin-top:20px; BORDER:2PX SOLID BLACK; }
A:HOVER{
COLOR:SEAGREEN;
PADDING:10PX 15PX;
}
/* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 0;
    text-align: center;
    backdrop-filter: blur(8px);
    background: rgba(10,10,10,0.6);
    z-index: 999;
  }
  .navbar a {
 font-family: 'Cinzel Decorative', cursive;
    color: whitesmoke;
    text-decoration: none;
    margin: 0 20px;
    letter-spacing: 1px;
    transition: 0.3s;
font-size:20px;
    font-weight: 600;
  }
  .navbar a:hover {
 background: linear-gradient(90deg, #2c3e50, #4ca1af);

padding:7px 10px;
border-radius:6px;

  }

  </style>
</head>
<body>
<!-- Navbar -->
<div class="navbar">
  <a href="home.html">HOME</a>
  <a href="shop.html">SHOPPING</a>
  <a href="ABOUT.HTML">ABOUT</a>
  <a href="CONTACT.HTML">CONTACT</a>
<a href="cart.html">🛒 CART</a>
</div>

  <h1>Checkout 💖</h1>
  <div id="checkout-box" class="box"></div>
  <a href="SHOP.html">← Back to Shop</a>
<script>
  const product = JSON.parse(localStorage.getItem('checkout'));
  const box = document.getElementById('checkout-box');

  if (!product) {
    box.innerHTML = '<p>No product selected. Use Buy Now on a product.</p>';
  } else {
    box.innerHTML = `
      <img src="${product.image}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p>₹${product.price}</p>
      <button onclick="confirmPurchase()">Confirm Purchase</button>
    `;
  }

  function confirmPurchase() {
    alert('Thank you for your purchase from Luvora 💕');
    // optionally, if you want Buy Now to also add to cart, you can push to cart here
    localStorage.removeItem('checkout');
    window.location.href = 'SHOP.html';
  }
</script>
</body>
</html>
