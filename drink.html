<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:#0d0d0d;
    color:#f5f5f5;
  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 0;
    text-align: center;
    backdrop-filter: blur(8px);
    background: rgba(10,10,10,0.6);
    z-index: 999;
  }
  .navbar a {
 font-family: 'Cinzel Decorative', cursive;
    color: whitesmoke;
    text-decoration: none;
    margin: 0 20px;
    letter-spacing: 1px;
    transition: 0.3s;
font-size:20px;
    font-weight: 600;
  }
  .navbar a:hover {
 background: linear-gradient(90deg, #2c3e50, #4ca1af);

padding:7px 10px;
border-radius:6px;

  }


  /* Grid */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:35px;
    padding:120px 60px 80px;
  }

  .product-card{
    background:rgba(25,25,25,0.85);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    transition:0.3s ease;
  }
  .product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 30px rgba(0,0,0,0.8);
  }
  .product-card img{
    width:100%;
    height:380px;
    object-fit:cover;
    opacity:0.95;
    transition:0.3s;
  }
  .product-card:hover img{
    opacity:1;
  }
  .product-info{
    padding:20px;
    text-align:center;
  }
  .product-info h4{
    color:#fff;
    margin-bottom:8px;
    font-weight:500;
  }
  .price{
    color:#ff5fa2;
    font-weight:600;
    margin-bottom:15px;
  }

  /* Buttons */
  .btn{
    padding:10px 25px;
    border:none;
    border-radius:25px;
    font-size:0.9em;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.3s;
    margin:5px;
  }
  .btn-cart{
    background:transparent;
    color:#ff5fa2;
    border:1px solid #ff5fa2;
  }
  .btn-cart:hover{
    background:#ff5fa2;
    color:#fff;
  }
  .btn-buy{
    background:linear-gradient(135deg,#ff4081,#c2185b);
    color:#fff;
  }
  .btn-buy:hover{
    background:linear-gradient(135deg,#ff5fa2,#d81b60);
    transform:scale(1.05);
  }

  footer{
    text-align:center;
    background:#0b0b0b;
    padding:40px 10px;
    color:#999;
    font-size:0.9em;
    letter-spacing:1px;
  }
</style>

<script>
function addToCart(name, price, image) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  // check if item already exists
  let existing = cart.find(item => item.name === name);
  if (existing) {
    existing.qty += 1; // add quantity if same item again
  } else {
    cart.push({
      name: name,
      price: Number(price), // ensure it’s a number
      image: image,
      qty: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart!");
}
</script>
