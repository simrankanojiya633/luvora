<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luvora — Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    padding: 50px;
  }
/* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    padding: 15px 0px;
    text-align: center;
    backdrop-filter: blur(8px);
    background: rgba(10,10,10,0.6);
    z-index: 999;
  }
  .navbar a {
 font-family: 'Cinzel Decorative', cursive;
    color: whitesmoke;
    text-decoration: none;
    margin: 0 20px;
    letter-spacing: 1px;
    transition: 0.3s;
font-size:20px;
    font-weight: 600;
  }
  .navbar a:hover {
 background: linear-gradient(90deg, #2c3e50, #4ca1af);

padding:7px 10px;
border-radius:6px;

  }


  h1 {
    font-size: 2em;
    color: #ff5fa2;
    margin-bottom: 30px;
  }

  /* 🩷 Grid layout for cart */
  #cart-items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 30px;
    justify-items: center;
    padding: 20px;
  }

  /* Each product card */
  .item {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 15px;
    width: 230px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    transition: transform 0.3s ease;
  }

  .item:hover {
    transform: scale(1.05);
  }

  img {
    width: 130px;
    height: 150px;
    border-radius: 10px;
    object-fit: cover;
    margin-bottom: 10px;
  }

  .info h3 {
    margin: 0;
    font-size: 16px;
  }

  .info p {
    margin: 4px 0;
    font-size: 14px;
    color: #ccc;
  }

  .qty {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin: 8px 0;
  }

  button {
    background: #ff5fa2;
    border: none;
    padding: 8px 16px;
    border-radius: 25px;
    cursor: pointer;
    color: #fff;
    font-weight: 600;
    transition: 0.3s;
  }

  button:hover {
    background: #ff7fbf;
  }

  /* Total & Buy All button */
  #cart-summary {
    margin-top: 40px;
  }

  #total {
    font-size: 22px;
    font-weight: bold;
    color: #ffb3d9;
    margin-bottom: 15px;
  }

  #buy-all {
    background: linear-gradient(135deg, #ff4081, #c2185b);
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  #buy-all:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #ff5fa2, #d81b60);
  }

  a {
    color: #ff5fa2;
    text-decoration: none;
    display: block;
    margin-top: 25px;
  }
</style>
</head>

<body>
<!-- Navbar -->
<div class="navbar">
  <span><a href="home.html">HOME</a></span>
  <span><a href="shop.html">SHOPPING</a></span>
  <a href="ABOUT.HTML">ABOUT</a>
  <a href="CONTACT.HTML">CONTACT</a>
<a href="cart.html">🛒 CART</a>
</div>

  <h1>Your Cart 🛍️</h1>
  <div id="cart-items"></div>

  <div id="cart-summary">
    <div id="total">Total: ₹0</div>
    <button id="buy-all">Buy All Now</button>
  </div>

  <a href="shop.html">← Continue Shopping</a>

<script>
  // Load cart from localStorage
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  const cartContainer = document.getElementById('cart-items');
  const totalDiv = document.getElementById('total');

  function displayCart() {
    cartContainer.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
      const div = document.createElement('div');
      div.classList.add('item');
      div.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <div class="info">
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>
          <div class="qty">
            <button onclick="decrease(${index})">−</button>
            <span>${item.quantity}</span>
            <button onclick="increase(${index})">+</button>
          </div>
          <button onclick="removeItem(${index})">Remove</button>
        </div>
      `;
      cartContainer.appendChild(div);
      total += item.price * item.quantity;
    });

    totalDiv.innerText = `Total: ₹${total}`;
  }

  function increase(index) {
    cart[index].quantity++;
    saveCart();
  }

  function decrease(index) {
    if (cart[index].quantity > 1) cart[index].quantity--;
    saveCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
  }

  function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
    displayCart();
  }

  document.getElementById('buy-all').addEventListener('click', () => {
    if (cart.length === 0) {
      alert('Your cart is empty!');
    } else {
      alert('Thank you for shopping with Luvora 💖 — your order has been placed!');
      localStorage.removeItem('cart');
      cart = [];
      displayCart();
    }
  });

  displayCart();
</script>

</body>
</html>
